<div class="wrap">
  <header>
    <div class="eyebrow">Nurse Executive · Board Certified</div>
    <h1>NE-BC Drill</h1>
    <p class="sub">Scenario questions across the four domains of the October 2025 outline. Pick the best answer, then read why.</p>
  </header>

  <section aria-label="Progress by domain">
    <div class="board" id="board"></div>
  </section>

  <section class="weak" aria-label="Your weak spots">
    <h2>Your weak spots <span id="seen"></span></h2>
    <div id="weak"></div>
  </section>

  <section class="modes" aria-label="Choose a set">
    <button class="btn primary" id="m-mix">Mixed 10</button>
    <button class="btn" data-dom="HR">Human Resources</button>
    <button class="btn" data-dom="QS">Quality &amp; Safety</button>
    <button class="btn" data-dom="BM">Business Mgmt</button>
    <button class="btn" data-dom="HCD">Care Delivery</button>
    <button class="btn" id="m-miss">Missed ones</button>
  </section>

  <main id="stage"></main>

  <p class="foot">Original practice questions, not ANCC items. Progress is saved on this device only. <button class="btn" id="reset" style="padding:4px 10px;font-size:.85rem">Reset progress</button> <span id="confirm" hidden> Sure? <button class="btn" id="reset-yes" style="padding:4px 10px;font-size:.85rem">Yes, reset</button></span></p>
</div>

<script>
const DOMAINS={HR:{name:"Human Resource Mgmt",color:"var(--hr)"},QS:{name:"Quality & Safety",color:"var(--qs)"},BM:{name:"Business Mgmt",color:"var(--bm)"},HCD:{name:"Health Care Delivery",color:"var(--hcd)"}};

const Q=[
// ---------- Human Resource Management ----------
{d:"HR",q:"A staff nurse gives the wrong dose after a pump library error. She reported it immediately. Under a just culture model, the manager's first step is to:",o:["Issue a written warning to document the error","Console the nurse and look at the system that allowed the error","Require remedial pump training before her next shift","Report her to the board of nursing"],a:1,w:"Just culture separates human error (console), at-risk behavior (coach) and reckless behavior (discipline). An honest slip caused by a system flaw calls for consoling and fixing the system.",h:"Human error → console. At-risk → coach. Reckless → sanction."},
{d:"HR",q:"Two charge nurses keep clashing over break coverage. The manager wants a solution both can fully support. Which conflict approach fits best?",o:["Avoiding","Compromising","Collaborating","Competing"],a:2,w:"Collaborating aims for a win-win that meets both parties' needs. Compromising splits the difference so each gives something up. It takes longer but fits a recurring issue between peers.",h:"Collaborate = both win. Compromise = both lose a little."},
{d:"HR",q:"Staff say they like their pay and schedules but feel no sense of accomplishment. According to Herzberg, the manager should focus on:",o:["Hygiene factors such as salary","Motivators such as recognition and growth","Stricter attendance policies","Improving the break room"],a:1,w:"Herzberg's hygiene factors (pay, policy, conditions) prevent dissatisfaction but don't motivate. Motivators like achievement, recognition, responsibility and growth drive satisfaction.",h:"Hygiene keeps them from leaving. Motivators make them want to stay."},
{d:"HR",q:"A new graduate can follow protocols but struggles to prioritize when the unit gets busy. On Benner's scale she is most likely:",o:["Novice","Advanced beginner","Competent","Proficient"],a:1,w:"Advanced beginners can handle recurring situations with guidance but can't yet see the big picture or prioritize well. Competent nurses (usually 2–3 years) plan deliberately and set priorities.",h:"Novice → Advanced beginner → Competent → Proficient → Expert."},
{d:"HR",q:"Which leadership style is most associated with inspiring staff around a shared vision and developing them as individuals?",o:["Transactional","Laissez-faire","Transformational","Autocratic"],a:2,w:"Transformational leaders use idealized influence, inspirational motivation, intellectual stimulation and individualized consideration. It's the style ANCC Magnet language centers on.",h:"Transformational = vision + growth. Transactional = rewards for tasks."},
{d:"HR",q:"The unit is launching bedside shift report. Using Lewin's change theory, the manager's first step is to:",o:["Train all staff on the new process","Help staff see why the current handoff isn't working","Make the new process policy","Audit compliance weekly"],a:1,w:"Lewin's stages are unfreeze, move (change) and refreeze. Unfreezing creates readiness by showing the need for change, often with data such as handoff-related events.",h:"Unfreeze (why) → Change (how) → Refreeze (stick)."},
{d:"HR",q:"Turnover of experienced RNs has climbed. Which action gives the manager the most useful information before people leave?",o:["Exit interviews","Stay interviews","Raising sign-on bonuses","Annual engagement survey only"],a:1,w:"Stay interviews ask current staff what keeps them and what might make them leave, so the manager can act early. Exit interviews only explain departures after the fact.",h:"Stay interviews are proactive. Exit interviews are an autopsy."},
{d:"HR",q:"A nurse has been late six times this quarter despite a verbal warning. The next step in progressive discipline is:",o:["Termination","A written warning with clear expectations","Ignoring it if patient care isn't affected","Transferring her to another unit"],a:1,w:"Progressive discipline usually moves from verbal warning to written warning, then suspension, then termination. Each step documents the expectation and consequence.",h:"Verbal → Written → Suspension → Termination."},
{d:"HR",q:"When delegating a task to a UAP, which right is the RN NOT allowed to hand off?",o:["Right task","Right supervision","Accountability for the overall outcome","Right communication"],a:2,w:"The RN can delegate the task but keeps accountability for delegation decisions and the patient outcome. The five rights are task, circumstance, person, directions/communication and supervision/evaluation.",h:"You can delegate tasks, never accountability."},
{d:"HR",q:"A manager tells an experienced, motivated team the goal and lets them decide how to reach it. In Hersey-Blanchard situational leadership this is:",o:["Telling","Selling","Participating","Delegating"],a:3,w:"Delegating (low task, low relationship behavior) fits followers who are both able and willing. Telling fits low ability and low willingness.",h:"Match style to readiness: Tell → Sell → Participate → Delegate."},
{d:"HR",q:"Which structure puts staff nurses in formal decision-making over practice standards on their unit?",o:["Centralized hierarchy","Shared governance","Span of control","Chain of command"],a:1,w:"Shared governance gives clinical nurses authority and accountability for practice decisions through councils. It's a core expectation in Magnet's structural empowerment component.",h:"Shared governance = the people who do the work help decide the work."},
{d:"HR",q:"A nurse returning from a long medical leave asks for a modified schedule. Before deciding, the manager should first:",o:["Deny it to stay fair to other staff","Consult HR about accommodation obligations","Approve it informally without documentation","Ask other staff to vote on it"],a:1,w:"Leave and accommodation requests carry legal duties (for example under the ADA and FMLA). The manager should work with HR to handle it correctly and consistently.",h:"Legal question on a staff request? Loop in HR first."},
{d:"HR",q:"Kotter's model of change begins with:",o:["Creating a sense of urgency","Generating short-term wins","Anchoring changes in culture","Removing obstacles"],a:0,w:"Kotter's eight steps start with urgency, then a guiding coalition and a vision. Short-term wins and anchoring in culture come near the end.",h:"Kotter starts with urgency and ends with culture."},
// ---------- Quality & Safety ----------
{d:"QS",q:"A patient dies from an unexpected wrong-site procedure. The Joint Commission expects the organization to complete:",o:["A FMEA","A root cause analysis","A Pareto chart","A peer review only"],a:1,w:"A sentinel event requires a comprehensive systematic analysis, usually a root cause analysis with an action plan. FMEA is proactive and done before harm occurs.",h:"RCA looks back after harm. FMEA looks ahead before it."},
{d:"QS",q:"Before rolling out a new smart-pump system, the team wants to find where it could fail. The best tool is:",o:["Root cause analysis","Failure mode and effects analysis","Run chart","Fishbone after go-live"],a:1,w:"FMEA is prospective. It maps the process, identifies failure modes, and ranks them by severity, occurrence and detectability so the riskiest get fixed first.",h:"New process or equipment → FMEA."},
{d:"QS",q:"The unit tests a new fall-prevention bundle on one shift for two weeks, studies the data, then adjusts. This is:",o:["Six Sigma DMAIC","Lean value stream mapping","PDSA cycle","Benchmarking"],a:2,w:"Plan-Do-Study-Act uses small, rapid tests of change before spreading them. Starting on one shift is a classic small test.",h:"PDSA = test small, learn fast, then spread."},
{d:"QS",q:"Which chart helps the team focus on the few causes behind most medication errors?",o:["Control chart","Pareto chart","Scatter diagram","Gantt chart"],a:1,w:"A Pareto chart ranks causes by frequency so the team can attack the vital few (the 80/20 rule).",h:"Pareto = 80% of the problem from 20% of the causes."},
{d:"QS",q:"A manager wants to know whether this month's CLABSI rise is real or normal variation. The best tool is:",o:["Control chart","Histogram","Flowchart","Pareto chart"],a:0,w:"A control chart shows data over time against statistically set upper and lower limits, separating common-cause from special-cause variation.",h:"Control chart = is this signal or noise?"},
{d:"QS",q:"A nurse catches a wrong medication before it reaches the patient. The best response is to:",o:["Skip reporting since no harm occurred","Report it as a near miss","Report only if it happens again","Tell the pharmacist informally"],a:1,w:"Near misses show where the system's defenses are weak. High-reliability organizations encourage reporting them so problems get fixed before harm happens.",h:"Near misses are free lessons. Report them."},
{d:"QS",q:"'Preoccupation with failure' and 'deference to expertise' are principles of:",o:["Lean management","High reliability organizations","Total quality management","Magnet designation"],a:1,w:"Weick and Sutcliffe's five HRO principles are preoccupation with failure, reluctance to simplify, sensitivity to operations, commitment to resilience and deference to expertise.",h:"HRO: always expect something could go wrong."},
{d:"QS",q:"Which communication tool is designed to give a physician a structured, concise report on a deteriorating patient?",o:["SBAR","Teach-back","Huddle","Time-out"],a:0,w:"SBAR (Situation, Background, Assessment, Recommendation) standardizes urgent clinician-to-clinician communication. It came from the military and was adapted in health care.",h:"SBAR ends with what you want: the Recommendation."},
{d:"QS",q:"The national nursing database that lets a unit compare its falls and pressure injuries with similar units is:",o:["HCAHPS","NDNQI","Leapfrog","CMS Star Ratings"],a:1,w:"The National Database of Nursing Quality Indicators collects nurse-sensitive measures at the unit level for benchmarking. HCAHPS measures the patient experience.",h:"NDNQI = nurse-sensitive, unit-level benchmarks."},
{d:"QS",q:"Reason's 'Swiss cheese' model explains that adverse events usually result from:",o:["One individual's mistake","Holes in several layers of defense lining up","Poor patient compliance","Equipment failure alone"],a:1,w:"Each layer of defense has weaknesses. Harm happens when the holes align, so the fix is strengthening layers rather than blaming one person.",h:"Harm gets through when the holes line up."},
{d:"QS",q:"CMS no longer pays hospitals extra for certain conditions acquired during the stay, such as a stage 3 pressure injury. These are called:",o:["Core measures","Hospital-acquired conditions","Sentinel events","Quality indicators"],a:1,w:"Under the HAC policy CMS doesn't pay the higher DRG for selected preventable conditions acquired in the hospital. A separate HAC Reduction Program penalizes the worst-performing hospitals.",h:"HACs: the hospital caused it, so the hospital pays."},
// ---------- Business Management ----------
{d:"BM",q:"A unit has an average daily census of 20 and a target of 8 nursing hours per patient day. How many nursing hours are needed per day?",o:["28","120","160","200"],a:2,w:"Required hours = census × HPPD = 20 × 8 = 160 hours per 24 hours.",h:"Census × HPPD = hours needed."},
{d:"BM",q:"How many paid hours per year does one full-time equivalent (1.0 FTE) represent?",o:["1,800","1,950","2,080","2,280"],a:2,w:"1.0 FTE = 40 hours × 52 weeks = 2,080 paid hours. A 0.9 FTE is 1,872 hours.",h:"40 × 52 = 2,080."},
{d:"BM",q:"Supplies were budgeted at $50,000 but cost $56,000. Patient volume was 15% above budget. The supply variance is best described as:",o:["Unfavorable, needing a corrective plan","Favorable once adjusted for volume","Neutral","A capital budget issue"],a:1,w:"A flexible budget adjusts for volume: $50,000 × 1.15 = $57,500 expected. Spending $56,000 is $1,500 under that, so it's favorable.",h:"Always adjust for volume before calling a variance bad."},
{d:"BM",q:"A $250,000 bedside monitoring system that will last 7 years belongs in the:",o:["Operating budget","Capital budget","Personnel budget","Cash budget"],a:1,w:"Capital budgets cover major purchases above the organization's dollar threshold with a useful life longer than a year. The operating budget covers day-to-day revenue and expenses.",h:"Big ticket + lasts years = capital."},
{d:"BM",q:"Which cost rises and falls directly with patient volume?",o:["Manager's salary","Building depreciation","Medical supplies","Equipment lease"],a:2,w:"Variable costs change with volume (supplies, linen, per-diem staffing). Fixed costs, like the manager's salary and depreciation, stay the same within a relevant range.",h:"More patients, more supplies: variable."},
{d:"BM",q:"Under Medicare's Hospital Value-Based Purchasing program, payment depends partly on:",o:["Volume of procedures performed","Quality and patient experience scores","Number of licensed beds","Length of stay alone"],a:1,w:"VBP withholds a percentage of Medicare payments and redistributes it based on performance on quality, safety, efficiency and patient experience (HCAHPS) measures.",h:"Value-based = paid for outcomes, not volume."},
{d:"BM",q:"A budget built from scratch each year, with every expense justified, is a:",o:["Incremental budget","Zero-based budget","Flexible budget","Fixed budget"],a:1,w:"Zero-based budgeting starts from zero and justifies every line. Incremental budgeting adds a percentage to last year's numbers.",h:"Zero-based = justify everything, every year."},
{d:"BM",q:"A proposal to add a discharge nurse costs $95,000 a year and is projected to prevent readmissions worth $140,000. The ROI is about:",o:["32%","47%","68%","147%"],a:1,w:"ROI = (gain − cost) ÷ cost = (140,000 − 95,000) ÷ 95,000 ≈ 47%.",h:"ROI = net gain ÷ cost."},
{d:"BM",q:"The unit's productivity report shows 110%. In most hospitals' measurement this means:",o:["Staff worked more hours than the workload required","The unit used fewer hours than the target for its workload","The budget was overspent by 10%","Overtime was 10% of hours"],a:1,w:"Productivity is usually target hours ÷ worked hours × 100. Over 100% means fewer hours were used than the workload called for. Check how your organization defines it, since a few flip the ratio.",h:"Productivity = earned (target) ÷ worked."},
// ---------- Health Care Delivery ----------
{d:"HCD",q:"A nurse asks, 'In post-op adults, does chlorhexidine bathing compared with soap reduce surgical site infections?' This question is written in which format?",o:["SBAR","PICOT","SMART","ADPIE"],a:1,w:"PICOT stands for Population, Intervention, Comparison, Outcome and Time. It frames a searchable clinical question, the first step in evidence-based practice.",h:"PICOT turns a hunch into a searchable question."},
{d:"HCD",q:"Which level of evidence is strongest for changing practice?",o:["Expert opinion","A single cohort study","Systematic review of randomized controlled trials","Case series"],a:2,w:"Systematic reviews and meta-analyses of RCTs sit at the top of most evidence hierarchies. Expert opinion is at the bottom.",h:"Systematic review of RCTs sits on top."},
{d:"HCD",q:"The Hospital Readmissions Reduction Program penalizes hospitals for excess 30-day readmissions. The nurse leader's highest-impact focus is:",o:["Shortening length of stay","Discharge teaching, med reconciliation and follow-up","Admitting fewer high-risk patients","Increasing observation status"],a:1,w:"Readmissions fall most with strong transitions of care: teach-back, medication reconciliation, scheduled follow-up and post-discharge calls.",h:"Readmissions are a transitions problem."},
{d:"HCD",q:"A competent adult patient refuses a blood transfusion for religious reasons. The nurse leader supports the team in respecting:",o:["Beneficence","Autonomy","Justice","Fidelity"],a:1,w:"Autonomy is a competent person's right to make decisions about their own care, even ones the team disagrees with. The team still documents informed refusal.",h:"Competent adult says no → autonomy wins."},
{d:"HCD",q:"What defines what an RN may legally do in a given state?",o:["The hospital's policy manual","The state nurse practice act","ANA Code of Ethics","The Joint Commission standards"],a:1,w:"Each state's nurse practice act, enforced by its board of nursing, sets the legal scope of practice. Facility policy can be narrower but can't expand it.",h:"Policy can narrow scope, never widen it."},
{d:"HCD",q:"During a mass-casualty event, the hospital's command structure that assigns roles like incident commander and operations chief is:",o:["Hospital Incident Command System","Rapid response team","Shared governance","Chain of command policy"],a:0,w:"HICS is the hospital version of the national Incident Command System. It gives a predictable, scalable structure with defined roles during emergencies.",h:"Disaster → HICS. Know your role card."},
{d:"HCD",q:"Which approach best addresses health equity for a unit serving many patients with limited English proficiency?",o:["Using bilingual family members to interpret","Providing qualified medical interpreters","Giving written English materials only","Relying on staff who speak some Spanish"],a:1,w:"Qualified interpreters reduce errors and are required under federal civil rights rules for facilities that receive federal funds. Family members, especially minors, shouldn't be used for clinical interpreting.",h:"Qualified interpreter, every time."},
{d:"HCD",q:"An EHR alert recommends VTE prophylaxis based on a patient's risk score. This is an example of:",o:["Clinical decision support","Telehealth","Interoperability","Data mining"],a:0,w:"Clinical decision support gives clinicians patient-specific information or recommendations at the point of care. Alert fatigue is its main risk.",h:"CDS nudges the right action at the right time."},
{d:"HCD",q:"The Magnet model's component that focuses on the nurse leader's vision and influence across the organization is:",o:["Structural empowerment","Transformational leadership","Exemplary professional practice","New knowledge and innovation"],a:1,w:"Magnet's five components are transformational leadership, structural empowerment, exemplary professional practice, new knowledge/innovation, and empirical outcomes.",h:"Magnet: TL, SE, EP, NK, EO."},
{d:"HCD",q:"Interprofessional rounds where each discipline contributes to one shared plan of care mainly improve:",o:["Billing accuracy","Care coordination and communication","Physician autonomy","Nurse overtime"],a:1,w:"Structured interprofessional rounds align goals, reduce duplicated or missed work, and are linked to better outcomes and shorter stays.",h:"One patient, one plan, every discipline at the table."},
// ---------- Batch 2: Human Resource Management ----------
{d:"HR",q:"A manager has 90 direct reports across three shifts. The most likely consequence of this span of control is:",o:["Faster decision-making on the unit","Less time for coaching and recognizing each employee","Lower labor cost with no downside","Stronger staff engagement"],a:1,w:"A very wide span of control limits how much individual attention, feedback and recognition each person gets. Organizations often add assistant managers or shift leaders to close the gap.",h:"Wide span = thin attention per person."},
{d:"HR",q:"Which interview question is behavioral?",o:["What are your greatest strengths?","Where do you see yourself in five years?","Tell me about a time you handled a conflict with a coworker.","Why do you want this job?"],a:2,w:"Behavioral questions ask for real past examples, on the idea that past behavior predicts future behavior. Candidates are often coached to answer with the STAR method (Situation, Task, Action, Result).",h:"Behavioral starts with 'Tell me about a time…'"},
{d:"HR",q:"Which question should a manager NOT ask a job candidate?",o:["Are you able to work rotating weekends?","Do you plan to start a family soon?","Do you hold an active RN license in this state?","Can you describe your charge nurse experience?"],a:1,w:"Questions about family plans, age, religion, national origin or disability can show discriminatory intent under federal equal employment law. Ask only about job-related requirements.",h:"If it isn't about the job, don't ask it."},
{d:"HR",q:"A nurse tells her manager a coworker keeps making sexual comments, but asks the manager to keep it secret. The manager should:",o:["Promise complete confidentiality","Explain the report must be acted on and notify HR per policy","Wait to see if it happens again","Tell the nurse to handle it directly with the coworker"],a:1,w:"Once a manager knows about possible harassment, the organization must investigate. The manager can promise discretion, sharing only with those who need to know, but not total secrecy.",h:"Discretion, yes. Secrecy, no."},
{d:"HR",q:"Staff are trying to form a union. Under the National Labor Relations Act, the manager MAY:",o:["Ask staff how they plan to vote","Promise raises if the union effort fails","Share factual information about current pay and benefits","Watch who attends union meetings"],a:2,w:"Managers must avoid TIPS: Threats, Interrogation, Promises and Surveillance. Sharing accurate facts is allowed.",h:"No TIPS: Threaten, Interrogate, Promise, Surveil."},
{d:"HR",q:"A hospital uses the 8/80 overtime arrangement for hourly nurses. Overtime is owed for hours worked over:",o:["40 in a week only","8 in a day or 80 in a 14-day period","12 in a day only","80 in a month"],a:1,w:"The FLSA lets hospitals use a 14-day period instead of a 7-day week, paying overtime after 8 hours in a day or 80 hours in the 14 days, by agreement with employees.",h:"8 a day or 80 in two weeks."},
{d:"HR",q:"To be eligible for FMLA leave, an employee must have worked for the employer at least:",o:["90 days and 500 hours","12 months and 1,250 hours in the past year","6 months and 1,000 hours","2 years full-time"],a:1,w:"FMLA covers employees with 12 months of service and 1,250 hours in the prior 12 months, at a site with 50+ employees within 75 miles. It gives up to 12 weeks of unpaid, job-protected leave.",h:"12 months, 1,250 hours, 12 weeks."},
{d:"HR",q:"An experienced nurse regularly rolls her eyes and ignores questions from new graduates. The manager's best response is to:",o:["Wait for the new graduates to adjust","Address the behavior directly with her using the code of conduct","Move the new graduates to another shift","Discuss it at the next staff meeting without names"],a:1,w:"Incivility and bullying hurt safety and retention. ANA's position calls for leaders to address it directly and consistently, not ignore it.",h:"Name the behavior, tie it to the standard."},
{d:"HR",q:"After a patient hits a nurse, the most important leadership action for preventing future workplace violence is to:",o:["Tell staff that violence is part of the job","Encourage reporting of every incident and review them for patterns","Only report injuries that need treatment","Leave reporting up to each nurse"],a:1,w:"Workplace violence is widely underreported. Leaders need complete reporting to find risk patterns and fix them, and should support the injured staff member.",h:"You can't fix what isn't reported."},
{d:"HR",q:"In Goleman's model, the foundation of emotional intelligence is:",o:["Social skill","Self-awareness","Empathy","Motivation"],a:1,w:"Goleman's components are self-awareness, self-regulation, motivation, empathy and social skill. Self-awareness, knowing your own emotions and their effect on others, comes first.",h:"EI starts with knowing yourself."},
{d:"HR",q:"A leader whose main focus is meeting the needs of staff so they can grow and do their best work practices:",o:["Transactional leadership","Servant leadership","Autocratic leadership","Charismatic leadership"],a:1,w:"Servant leadership, described by Greenleaf, puts followers' needs and development first. The leader serves the team.",h:"Servant leader = the team comes first."},
{d:"HR",q:"Rumors of layoffs are spreading. On Maslow's hierarchy, staff anxiety is mainly about:",o:["Self-actualization","Esteem","Safety and security","Belonging"],a:2,w:"Job security falls under safety needs. People struggle to focus on higher needs like growth when lower needs feel threatened.",h:"Job worries = safety level."},
{d:"HR",q:"Staff say, 'Why bother with the clinical ladder? It never leads to a promotion here.' This lack of motivation is best explained by:",o:["Herzberg's two-factor theory","Vroom's expectancy theory","McGregor's Theory X","Maslow's hierarchy"],a:1,w:"Vroom says motivation depends on believing effort leads to performance (expectancy), that performance leads to a reward (instrumentality), and on valuing that reward (valence). Here instrumentality is missing.",h:"Vroom: effort → result → reward I value."},
{d:"HR",q:"A manager believes staff dislike work and must be closely watched. This reflects:",o:["Theory Y","Theory X","Theory Z","Servant leadership"],a:1,w:"McGregor's Theory X assumes people avoid work and need control. Theory Y assumes people are self-motivated and seek responsibility.",h:"X = watch them. Y = trust them."},
{d:"HR",q:"Which strategy most improves first-year retention of new graduate nurses?",o:["Shorter orientation","A structured 12-month nurse residency program","Higher sign-on bonuses only","Assigning them to night shift first"],a:1,w:"Structured residency programs, with ongoing support beyond orientation, are strongly linked to better first-year retention and confidence.",h:"Residency = support for the whole first year."},
{d:"HR",q:"How does a preceptor differ from a mentor?",o:["They are the same role","A preceptor guides short-term clinical orientation; a mentor supports long-term career growth","A mentor is always the manager","A preceptor is chosen by the new nurse"],a:1,w:"Precepting is a time-limited, assigned teaching role during orientation. Mentoring is a longer, usually voluntary relationship focused on career development.",h:"Preceptor = orientation. Mentor = career."},
{d:"HR",q:"When opening a coaching conversation about a performance problem, the manager should start with:",o:["The consequences if it continues","A specific description of the observed behavior","Comments from coworkers","The employee's attitude"],a:1,w:"Effective feedback is specific and behavioral, such as the Situation-Behavior-Impact approach. Labels like 'bad attitude' cause defensiveness and aren't actionable.",h:"Describe what you saw, not who they are."},
{d:"HR",q:"A manager rates a nurse highly in every category because she is excellent with patients. This rating error is:",o:["Recency effect","Halo effect","Central tendency","Horns effect"],a:1,w:"The halo effect lets one strong trait inflate all ratings. The horns effect is the reverse, where one weakness drags everything down.",h:"Halo = one shine lights up everything."},
{d:"HR",q:"An annual review focuses mostly on a mistake the nurse made last month. This rating error is:",o:["Halo effect","Recency effect","Leniency","Similar-to-me bias"],a:1,w:"The recency effect overweights recent events. Keeping notes through the year and giving ongoing feedback helps prevent it.",h:"Recency = last month counts as the whole year."},
{d:"HR",q:"The three dimensions of burnout measured by the Maslach Burnout Inventory are:",o:["Fatigue, anger and anxiety","Emotional exhaustion, depersonalization and reduced personal accomplishment","Stress, turnover and absenteeism","Overtime, workload and pay"],a:1,w:"Maslach defines burnout as emotional exhaustion, depersonalization (cynicism toward patients or work) and a reduced sense of accomplishment.",h:"Exhausted, detached, ineffective."},
{d:"HR",q:"A nurse knows what the ethically right action is but feels institutional constraints prevent her from taking it. This is:",o:["Burnout","Moral distress","Compassion fatigue","Role ambiguity"],a:1,w:"Moral distress happens when you know the right thing to do but can't act on it. Leaders can help with ethics resources, debriefs and fixing the constraints.",h:"Moral distress = I know what's right but can't do it."},
{d:"HR",q:"Which scheduling approach is most associated with higher nurse satisfaction?",o:["Manager-assigned fixed schedules","Self-scheduling within unit guidelines","Mandatory overtime","Rotating every shift each week"],a:1,w:"Self-scheduling gives staff control over work-life balance and improves satisfaction and retention, as long as the unit's coverage rules are met.",h:"Control over schedule = more satisfied staff."},
{d:"HR",q:"Which hiring practice best reduces bias?",o:["Unstructured conversational interviews","Structured interviews with the same questions and a diverse panel","Hiring based on referrals only","Letting one manager decide alone"],a:1,w:"Structured interviews with consistent questions and scoring, plus diverse panels, reduce bias and predict job performance better.",h:"Same questions, same scoring, several voices."},
{d:"HR",q:"The purpose of succession planning is to:",o:["Fill vacancies with outside hires","Identify and develop internal staff for future leadership roles","Reduce the number of managers","Plan staff vacations"],a:1,w:"Succession planning builds a pipeline by finding high-potential employees and developing them before key roles open up.",h:"Grow your next leaders before you need them."},
{d:"HR",q:"When terminating an employee, the manager should:",o:["Do it at the end of a shift in front of the team","Meet privately with HR present and keep it brief and factual","Explain every detail of the decision at length","Let the employee's coworkers know first"],a:1,w:"Terminations should be private, brief, factual and documented, with HR present as a witness and to explain benefits and next steps.",h:"Private, brief, factual, HR in the room."},
{d:"HR",q:"A unionized nurse files a grievance about a schedule change. The manager should:",o:["Ignore it until the next contract","Follow the grievance steps in the collective bargaining agreement","Settle it informally off the record","Discipline the nurse for filing"],a:1,w:"In a union setting, the contract sets the grievance procedure. Retaliating against someone for filing is prohibited.",h:"Union shop → the contract rules."},
{d:"HR",q:"A new task force is arguing about roles and who is in charge. In Tuckman's model, the team is in:",o:["Forming","Storming","Norming","Performing"],a:1,w:"Tuckman's stages are forming, storming, norming, performing and adjourning. Storming is the conflict stage as members test roles and power.",h:"Form, storm, norm, perform, adjourn."},
{d:"HR",q:"A committee agrees quickly to avoid conflict, and no one raises concerns. To prevent this groupthink, the leader should:",o:["Push for a fast vote","Assign someone to play devil's advocate","Limit discussion time","Have only senior members speak"],a:1,w:"Groupthink happens when the wish for harmony overrides critical thinking. A devil's advocate, inviting dissent, and outside input help prevent it.",h:"Assign someone to disagree."},
{d:"HR",q:"Staff follow a charge nurse's lead because they admire and respect her. This is:",o:["Legitimate power","Referent power","Coercive power","Reward power"],a:1,w:"French and Raven's power types are legitimate (position), reward, coercive, expert (knowledge) and referent (admiration and personal connection).",h:"Referent = people follow because they like you."},
{d:"HR",q:"Staff follow a nurse's advice on wound care because she is a certified wound specialist. This is:",o:["Expert power","Legitimate power","Referent power","Coercive power"],a:0,w:"Expert power comes from specialized knowledge or skill, whatever the person's title.",h:"Expert = they know the most about it."},
{d:"HR",q:"A nurse skips barcode scanning because it's slow and 'everyone does it.' Under just culture this is:",o:["Human error","At-risk behavior, which calls for coaching","Reckless behavior, which calls for discipline","Acceptable practice"],a:1,w:"At-risk behavior is a choice whose risk isn't recognized or is believed justified. The response is coaching plus removing the reason for the workaround.",h:"Workaround everyone does = at-risk → coach."},
{d:"HR",q:"A nurse knowingly ignores a substantial, obvious risk to a patient. Under just culture the appropriate response is:",o:["Console","Coach","Disciplinary action","No action"],a:2,w:"Reckless behavior, consciously disregarding substantial and unjustifiable risk, warrants remedial or disciplinary action whatever the outcome.",h:"Reckless → sanction."},
{d:"HR",q:"A dependable nurse's performance has slipped since a divorce. The manager's best step is to:",o:["Start progressive discipline right away","Talk privately about expectations and refer her to the employee assistance program","Ignore it until it improves","Ask coworkers about her personal life"],a:1,w:"The manager addresses the performance gap, offers support through the EAP, and stays out of counseling about personal matters.",h:"Address the work, refer the person."},
{d:"HR",q:"A manager suspects a nurse of diverting narcotics. The manager should:",o:["Confront the nurse alone and ask for a confession","Follow the organization's diversion policy, working with pharmacy and HR","Wait for more evidence before acting","Quietly change her assignment"],a:1,w:"Diversion threatens patients and the nurse. Policies usually call for a prompt investigation with pharmacy and HR, removal from patient care, and required reporting.",h:"Suspected diversion → policy, pharmacy, HR."},
{d:"HR",q:"A nurse quits after learning a peer with less experience was hired at a higher rate. This is best explained by:",o:["Equity theory","Theory X","Expectancy theory","Maslow's hierarchy"],a:0,w:"Adams' equity theory says people compare their effort and rewards with others'. Perceived unfairness lowers motivation and drives turnover.",h:"Equity = am I treated fairly compared to others?"},
// ---------- Batch 2: Quality & Safety ----------
{d:"QS",q:"In Donabedian's model, the nurse-to-patient ratio on a unit is a measure of:",o:["Structure","Process","Outcome","Balancing"],a:0,w:"Donabedian's framework is structure (resources and setting), process (what care is delivered) and outcome (results for patients). Staffing is structure.",h:"Structure = what you have. Process = what you do. Outcome = what happens."},
{d:"QS",q:"Hand hygiene compliance rate is which type of measure?",o:["Structure","Process","Outcome","Patient experience"],a:1,w:"Hand hygiene is an action in delivering care, so it's a process measure. The infection rate it affects would be an outcome measure.",h:"Something staff do = process."},
{d:"QS",q:"A unit tracks whether shortening length of stay is raising readmissions. Readmission rate here is a:",o:["Outcome measure","Process measure","Balancing measure","Structure measure"],a:2,w:"A balancing measure checks whether an improvement in one area is causing problems somewhere else.",h:"Balancing = did we break something else?"},
{d:"QS",q:"Lean methodology focuses mainly on:",o:["Reducing variation with statistics","Eliminating waste and non-value-added steps","Accreditation readiness","Staff satisfaction"],a:1,w:"Lean, from the Toyota Production System, removes waste such as waiting, extra motion and rework. Six Sigma focuses on reducing variation and defects.",h:"Lean = cut waste. Six Sigma = cut variation."},
{d:"QS",q:"The first phase of a Six Sigma DMAIC project is:",o:["Measure","Define","Analyze","Control"],a:1,w:"DMAIC stands for Define, Measure, Analyze, Improve, Control. You first define the problem, scope and goal.",h:"Define before you measure."},
{d:"QS",q:"A team groups possible causes of patient falls under people, methods, equipment and environment. They are using a:",o:["Pareto chart","Fishbone (Ishikawa) diagram","Control chart","Gantt chart"],a:1,w:"A fishbone diagram organizes possible causes into categories to support root cause analysis.",h:"Fishbone = causes sorted into bones."},
{d:"QS",q:"The main purpose of a rapid response team is to:",o:["Replace the code team","Assess and treat patients showing early signs of deterioration","Transport patients to radiology","Handle family complaints"],a:1,w:"Rapid response teams bring critical care expertise to the bedside early, to prevent cardiac arrest and unplanned ICU transfers.",h:"RRT = before the code."},
{d:"QS",q:"Which is an acceptable patient identifier under the National Patient Safety Goals?",o:["Room number","Patient's name and date of birth","Bed location","Diagnosis"],a:1,w:"The Joint Commission requires at least two patient-specific identifiers. Room or bed number is never acceptable.",h:"Two identifiers, never the room number."},
{d:"QS",q:"Under the Universal Protocol, the time-out happens:",o:["The day before surgery","Right before the procedure starts, with the whole team","After the procedure","Only for emergency procedures"],a:1,w:"The Universal Protocol includes pre-procedure verification, site marking, and a time-out right before starting, when the whole team confirms patient, procedure and site.",h:"Time-out = everyone stops and confirms."},
{d:"QS",q:"After a medication error harms a patient, best practice is to:",o:["Disclose only if the patient asks","Disclose promptly and honestly, with an apology and a plan","Have legal handle all communication","Avoid discussing it until the investigation ends"],a:1,w:"Communication-and-resolution approaches like AHRQ's CANDOR support prompt, honest disclosure. Transparency builds trust and can lower litigation.",h:"Harm happened → tell them, early and honestly."},
{d:"QS",q:"A nurse involved in a serious error is distraught and talking about quitting. She is experiencing:",o:["Moral distress","The second victim phenomenon","Burnout","Compassion fatigue"],a:1,w:"Second victims are clinicians traumatized by an adverse event. Peer support programs help them recover and stay in practice.",h:"The clinician is hurt by the error too."},
{d:"QS",q:"A nurse wants to confirm a patient understands discharge instructions. The best method is:",o:["Asking 'Do you understand?'","Having the patient explain the instructions in their own words","Giving a written handout","Having the family sign the form"],a:1,w:"Teach-back checks understanding by having patients restate the information. It works across all health literacy levels.",h:"Teach-back: 'Tell me how you'll take this at home.'"},
{d:"QS",q:"In TeamSTEPPS, 'CUS' is used to:",o:["Schedule staff","Escalate a safety concern by saying you're Concerned, Uncomfortable, and that it's a Safety issue","Close out a shift report","Document an event"],a:1,w:"CUS words signal growing concern and give any team member a shared way to stop the line.",h:"I'm Concerned, I'm Uncomfortable, this is a Safety issue."},
{d:"QS",q:"A nurse repeats back a verbal order and the physician confirms it. This is:",o:["SBAR","Closed-loop communication","A huddle","Teach-back"],a:1,w:"Closed-loop communication means the sender gives the message, the receiver repeats it back, and the sender confirms. It cuts misunderstandings.",h:"Say it, repeat it, confirm it."},
{d:"QS",q:"Comparing your unit's CAUTI rate with top-performing similar units is called:",o:["Benchmarking","Root cause analysis","FMEA","Peer review"],a:0,w:"Benchmarking compares performance against internal or external standards or best performers to set goals.",h:"Benchmark = how do we stack up?"},
{d:"QS",q:"Where should an incident report be kept?",o:["In the patient's medical record","With risk management or quality, separate from the chart","With the patient's discharge papers","Posted on the unit board"],a:1,w:"Incident reports are internal quality and risk documents. They go to risk management, and the chart shouldn't mention that one was filed. The facts of the event are still documented in the chart.",h:"Chart the facts, not the report."},
{d:"QS",q:"Which intervention most directly reduces CAUTI?",o:["Daily catheter bag changes","A nurse-driven protocol to remove catheters when no longer needed","Routine antibiotic prophylaxis","Inserting catheters on admission"],a:1,w:"Catheter days drive CAUTI risk. Nurse-driven removal protocols get catheters out promptly.",h:"Best CAUTI fix: take it out."},
{d:"QS",q:"Right after a patient fall, the unit holds a brief team meeting at the bedside to identify why it happened. This is a:",o:["Root cause analysis","Post-fall huddle","Peer review","Morbidity and mortality conference"],a:1,w:"A post-fall huddle happens soon after the event while details are fresh. It finds contributing factors and immediate fixes.",h:"Huddle right after the fall."},
{d:"QS",q:"Alarms constantly go off on a telemetry unit and staff tune them out. This safety problem is:",o:["Alert fatigue (alarm fatigue)","Normalization of documentation","Failure to rescue","Workarounds"],a:0,w:"Alarm fatigue happens when staff become desensitized to frequent, often non-actionable alarms. Alarm system safety is a Joint Commission National Patient Safety Goal.",h:"Too many alarms = none get heard."},
{d:"QS",q:"Medication reconciliation is required:",o:["Only on admission","At transitions of care: admission, transfer and discharge","Only for patients over 65","Only when the patient asks"],a:1,w:"Reconciling the patient's medication list at every transition prevents omissions, duplications and interactions.",h:"Every handoff, reconcile the meds."},
{d:"QS",q:"A run chart differs from a control chart because a run chart:",o:["Has statistically calculated control limits","Plots data over time around a median, without control limits","Ranks causes by frequency","Shows two variables' relationship"],a:1,w:"Run charts show trends over time with a median line, using simple rules to spot shifts. Control charts add statistical upper and lower limits.",h:"Run chart = median line. Control chart = limits."},
// ---------- Batch 2: Business Management ----------
{d:"BM",q:"A clinic's fixed costs are $60,000. Each visit brings $200 in revenue and has $80 in variable cost. How many visits are needed to break even?",o:["300","500","750","1,000"],a:1,w:"Break-even volume = fixed costs ÷ (price − variable cost per unit) = 60,000 ÷ 120 = 500 visits.",h:"Fixed ÷ contribution margin per unit."},
{d:"BM",q:"Revenue minus variable cost is the:",o:["Net income","Contribution margin","Gross revenue","Operating expense"],a:1,w:"Contribution margin is what's left to cover fixed costs and then profit. It's the key number in break-even analysis.",h:"Contribution margin pays the fixed costs."},
{d:"BM",q:"Housekeeping costs allocated to the nursing unit are an example of:",o:["Direct cost","Indirect cost","Variable cost","Capital cost"],a:1,w:"Direct costs tie straight to patient care on the unit, like nurse salaries and supplies. Indirect costs, like housekeeping, IT and administration, are shared and allocated.",h:"Shared service costs = indirect."},
{d:"BM",q:"Which hours are nonproductive?",o:["Direct patient care","Charge nurse duties","Vacation, sick time and education","Documentation"],a:2,w:"Nonproductive hours are paid but not worked on the unit, such as vacation, holiday, sick and education. Budgets must cover them on top of productive hours.",h:"Paid but not working = nonproductive."},
{d:"BM",q:"A unit needs 160 worked hours per day, every day of the year. About how many productive FTEs is that?",o:["20","28","31","40"],a:1,w:"160 × 365 = 58,400 hours ÷ 2,080 hours per FTE ≈ 28 productive FTEs. Adding nonproductive time (often around 10%) brings total paid FTEs to roughly 31.",h:"Hours per day × 365 ÷ 2,080."},
{d:"BM",q:"Paying agency nurses a higher hourly rate than budgeted creates a:",o:["Volume variance","Rate (price) variance","Efficiency variance","Capital variance"],a:1,w:"A rate variance comes from paying a different price per unit than budgeted. Efficiency variance is about using more or fewer hours per unit of work.",h:"Price per hour off budget = rate variance."},
{d:"BM",q:"A unit used 9.2 hours per patient day against a budget of 8.0 at normal census. This is mainly a:",o:["Volume variance","Rate variance","Efficiency (use) variance","Revenue variance"],a:2,w:"Using more hours per unit of workload than planned is an efficiency variance. Volume variance comes from census being higher or lower than budgeted.",h:"More hours per patient = efficiency variance."},
{d:"BM",q:"Under Medicare's DRG system, a hospital is paid:",o:["Its actual costs","A fixed amount based on the patient's diagnosis group","A daily rate for each day of stay","Whatever it bills"],a:1,w:"Diagnosis-related groups set a prospective, fixed payment per admission. Shorter, efficient stays improve the margin; longer stays cost the hospital.",h:"DRG = one fixed price per diagnosis."},
{d:"BM",q:"A higher case mix index means a hospital's patients are:",o:["Younger","More complex and resource-intensive","More likely to be uninsured","Staying for shorter periods"],a:1,w:"Case mix index is the average relative weight of the DRGs treated. A higher CMI means sicker patients who need more resources, and usually higher reimbursement.",h:"Higher CMI = sicker patients."},
{d:"BM",q:"Payer mix describes:",o:["The types of supplies purchased","The share of patients covered by Medicare, Medicaid, commercial insurance and self-pay","The staffing skill mix","The capital budget split"],a:1,w:"Payer mix strongly affects revenue because payers reimburse at very different rates.",h:"Payer mix = who's paying the bills."},
{d:"BM",q:"A new urgent care center opening across the street would appear in a SWOT analysis as a:",o:["Strength","Weakness","Opportunity","Threat"],a:3,w:"Strengths and weaknesses are internal. Opportunities and threats are external. A new competitor is an external threat.",h:"SW = inside. OT = outside."},
{d:"BM",q:"A cost-effectiveness analysis differs from a cost-benefit analysis because it:",o:["Converts every outcome to dollars","Compares costs to non-dollar outcomes like infections prevented","Ignores costs","Only looks at capital items"],a:1,w:"Cost-benefit puts a dollar value on both costs and outcomes. Cost-effectiveness compares cost per unit of a health outcome, such as cost per fall prevented.",h:"Cost-effectiveness = dollars per outcome."},
{d:"BM",q:"Which action most reduces supply costs without hurting care?",o:["Cutting all supply orders by 20%","Standardizing products and setting par levels","Letting each nurse order what they prefer","Buying in bulk regardless of use"],a:1,w:"Standardizing products and setting par levels reduces waste, expired stock and price variation.",h:"Standardize and set par levels."},
{d:"BM",q:"In a bundled payment, the provider receives:",o:["Separate payment for every service","One payment covering all services for an episode of care","A monthly fee per enrolled patient","Payment only for inpatient days"],a:1,w:"Bundled payments cover a whole episode, such as a joint replacement and recovery, which rewards coordination and efficiency across settings.",h:"One episode, one payment."},
{d:"BM",q:"Depreciation of a capital purchase is:",o:["A cash payment each year","Spreading the asset's cost over its useful life","The asset's resale value","An operating supply cost"],a:1,w:"Depreciation allocates a capital asset's cost across the years it is used, and it shows up as an expense in the operating budget.",h:"Depreciation spreads the cost over the asset's life."},
// ---------- Batch 2: Health Care Delivery ----------
{d:"HCD",q:"One RN is accountable 24 hours a day for a patient's plan of care from admission to discharge. This model is:",o:["Functional nursing","Team nursing","Primary nursing","Total patient care"],a:2,w:"In primary nursing, one RN holds round-the-clock accountability for planning a patient's care, with associate nurses carrying out care on other shifts.",h:"Primary = one nurse owns the plan."},
{d:"HCD",q:"One nurse gives all medications, another does all treatments, and an aide takes all vital signs. This model is:",o:["Functional nursing","Primary nursing","Team nursing","Case management"],a:0,w:"Functional nursing assigns staff by task. It's efficient but fragments care and lowers continuity.",h:"Functional = assigned by task."},
{d:"HCD",q:"An RN leads an LPN and a nursing assistant who share care for a group of patients. This model is:",o:["Functional nursing","Team nursing","Primary nursing","Total patient care"],a:1,w:"In team nursing an RN team leader plans care and directs a mixed-skill team for a group of patients.",h:"Team = RN leads a mixed crew."},
{d:"HCD",q:"A nurse coordinates a complex patient's care across hospital, rehab and home to control cost and improve outcomes. This is:",o:["Case management","Functional nursing","Primary nursing","Team nursing"],a:0,w:"Case management coordinates resources and services across the continuum of care, focused on quality outcomes and cost.",h:"Case manager = coordinator across settings."},
{d:"HCD",q:"The Patient Self-Determination Act requires hospitals to:",o:["Write advance directives for patients","Ask patients about advance directives and give information on admission","Require every patient to have one","Follow family wishes over the patient's"],a:1,w:"The PSDA requires facilities receiving Medicare and Medicaid funds to inform adult patients of their right to make advance directives and to document whether they have one.",h:"PSDA = ask and inform on admission."},
{d:"HCD",q:"For surgical informed consent, the nurse's role is usually to:",o:["Explain the risks and benefits of the surgery","Witness the patient's signature","Decide if the patient is competent","Obtain consent if the surgeon is busy"],a:1,w:"The provider doing the procedure explains it and obtains consent. The nurse usually witnesses the signature and speaks up if the patient doesn't seem to understand.",h:"Provider explains. Nurse witnesses."},
{d:"HCD",q:"A nurse who isn't involved in a celebrity patient's care opens the chart out of curiosity. This is:",o:["Allowed if she tells no one","A HIPAA privacy violation","Allowed for staff on the same unit","Only a policy issue, not a legal one"],a:1,w:"HIPAA limits access to the minimum necessary for job duties. Looking at a record without a work reason is a breach even if nothing is shared.",h:"No job reason = no access."},
{d:"HCD",q:"EMTALA requires a hospital emergency department to:",o:["Treat only insured patients","Provide a medical screening exam and stabilizing treatment regardless of ability to pay","Transfer uninsured patients right away","Collect payment before treatment"],a:1,w:"EMTALA requires Medicare-participating hospitals with EDs to screen and stabilize anyone with an emergency condition, whatever their insurance or ability to pay.",h:"EMTALA = screen and stabilize everyone."},
{d:"HCD",q:"To prove nursing malpractice, the plaintiff must show duty, breach, causation and:",o:["Intent","Damages","Negligent hiring","A prior complaint"],a:1,w:"The four elements of negligence are duty, breach of duty, causation and damages (actual harm).",h:"Duty, breach, cause, damage."},
{d:"HCD",q:"A hospital is held liable for a nurse employee's negligence on the job under:",o:["Res ipsa loquitur","Respondeat superior","Good Samaritan law","Statute of limitations"],a:1,w:"Respondeat superior ('let the master answer') makes employers liable for employees' acts within the scope of their work. Nurses can still be personally liable.",h:"Respondeat superior = the employer answers."},
{d:"HCD",q:"The care team and family disagree about continuing life support. The best resource to help resolve it is:",o:["Risk management","The ethics committee or ethics consult","The patient's insurer","Hospital security"],a:1,w:"Ethics committees offer consultation, mediation and guidance when stakeholders disagree about the right course of care.",h:"Values conflict → ethics consult."},
{d:"HCD",q:"Deciding how to allocate a limited number of ICU beds fairly involves which ethical principle?",o:["Autonomy","Justice","Veracity","Fidelity"],a:1,w:"Justice is about fair distribution of resources and equal treatment.",h:"Fair distribution = justice."},
{d:"HCD",q:"Being truthful with patients, even when the news is bad, reflects:",o:["Beneficence","Veracity","Nonmaleficence","Fidelity"],a:1,w:"Veracity is the duty to tell the truth. Fidelity is keeping promises and commitments.",h:"Veracity = truth."},
{d:"HCD",q:"Provision 1 of the ANA Code of Ethics states the nurse practices with:",o:["Loyalty to the employer above all","Compassion and respect for the inherent dignity, worth and unique attributes of every person","Obedience to physician orders","Priority to the most profitable patients"],a:1,w:"Provision 1 is about compassion and respect for every person's dignity and worth. Later provisions cover commitment to the patient, advocacy, accountability and more.",h:"Provision 1 = dignity of every person."},
{d:"HCD",q:"ANCC's Pathway to Excellence designation mainly recognizes:",o:["Research output","A positive practice environment for nurses","Financial performance","Trauma center capability"],a:1,w:"Pathway to Excellence focuses on standards for a healthy practice environment, such as shared decision-making, leadership, safety, quality, well-being and professional development.",h:"Pathway = great place for nurses to work."},
{d:"HCD",q:"In the Johns Hopkins evidence-based practice model, the three phases are:",o:["Plan, Do, Study","Practice question, Evidence, Translation","Define, Measure, Control","Assess, Plan, Evaluate"],a:1,w:"Johns Hopkins EBP uses PET: develop a Practice question, find and appraise the Evidence, then Translate it into practice.",h:"Hopkins = PET."},
{d:"HCD",q:"A project that generates new, generalizable knowledge with human subjects needs:",o:["Only manager approval","Institutional Review Board review","A PDSA cycle","A quality committee vote only"],a:1,w:"Research produces generalizable knowledge and needs IRB review to protect participants. QI and EBP projects apply existing knowledge locally, though many organizations still screen them.",h:"Research → IRB."},
{d:"HCD",q:"In Rogers' diffusion of innovations, the group that adopts change last is called:",o:["Innovators","Early majority","Laggards","Early adopters"],a:2,w:"The adopter categories are innovators, early adopters, early majority, late majority and laggards. Leaders use early adopters as champions to influence peers.",h:"Use early adopters to bring the majority along."},
{d:"HCD",q:"The Nurse Licensure Compact allows a nurse to:",o:["Practice in any country","Hold one multistate license and practice in other compact states","Skip continuing education","Practice as an APRN without a license"],a:1,w:"The NLC lets RNs and LPNs with a multistate license from their home compact state practice in person or by telehealth in other compact states.",h:"One license, many compact states."},
{d:"HCD",q:"Interoperability means:",o:["Staff can float between units","Different health IT systems can exchange and use information","One vendor runs all systems","Paper records are scanned"],a:1,w:"Interoperability lets information move between systems and be used, such as sharing records between a hospital EHR and a clinic.",h:"Systems that talk to each other."},
{d:"HCD",q:"Before a new EHR go-live, which strategy best supports staff adoption?",o:["Train only managers","Use trained unit superusers for at-the-elbow support","Give a manual and no training","Go live without testing"],a:1,w:"Superusers, frontline staff with extra training, give peer support at go-live and speed adoption.",h:"Superusers = peer support at the elbow."},
{d:"HCD",q:"Screening patients for food insecurity and transportation needs addresses:",o:["Core measures","Social determinants of health","Case mix index","Utilization review"],a:1,w:"Social determinants of health, such as housing, food, transportation and income, strongly drive outcomes and readmissions.",h:"SDOH = life outside the hospital."},
{d:"HCD",q:"An accountable care organization earns shared savings when it:",o:["Increases the number of services billed","Meets quality targets while spending less than projected for its population","Adds more beds","Avoids high-risk patients"],a:1,w:"ACOs share in savings if they lower total cost of care for an assigned population while meeting quality benchmarks.",h:"ACO = quality up, total cost down."},
{d:"HCD",q:"Hospice eligibility under Medicare generally requires:",o:["Any serious illness","A prognosis of six months or less if the illness runs its usual course","Admission to an ICU","Age over 75"],a:1,w:"Hospice requires certification of a terminal prognosis of six months or less, with a focus on comfort. Palliative care can be given at any stage, alongside curative treatment.",h:"Hospice ≤ 6 months. Palliative = any stage."},
{d:"HCD",q:"ED boarding is high because inpatient beds open late in the day. Which strategy best improves patient flow?",o:["Adding ED chairs","Discharge planning that starts on admission, with earlier-in-day discharges","Closing to ambulances","Holding admissions overnight"],a:1,w:"Planning discharge from admission and moving discharges earlier in the day frees beds sooner and improves throughput.",h:"Discharge starts on admission."},
{d:"HCD",q:"In START mass-casualty triage, patients who can walk are tagged:",o:["Red (immediate)","Yellow (delayed)","Green (minor)","Black (expectant)"],a:2,w:"START tags the walking wounded green (minor). Red is immediate, yellow is delayed, and black is deceased or expectant.",h:"Walking wounded = green."},
{d:"HCD",q:"A Joint Commission surveyor follows one patient's care through every department they touched. This method is:",o:["A tracer","A mock code","A root cause analysis","A peer review"],a:0,w:"Tracer methodology follows real patients' experiences to evaluate how systems and processes work across the organization.",h:"Tracer = follow the patient's path."},
{d:"HCD",q:"CMS Conditions of Participation are:",o:["Optional quality guidelines","Minimum standards a hospital must meet to receive Medicare and Medicaid payment","Nursing union rules","State licensure exams"],a:1,w:"Conditions of Participation are federal requirements for Medicare and Medicaid participation. Accrediting bodies like The Joint Commission can survey against them through deemed status.",h:"CoPs = rules to get paid by CMS."},
{d:"HCD",q:"A vision statement describes:",o:["What the organization does today","What the organization wants to become in the future","The organizational chart","The annual budget"],a:1,w:"The mission states the organization's purpose today. The vision describes the desired future. Values guide behavior.",h:"Mission = now. Vision = future."},
{d:"HCD",q:"In a matrix organizational structure, a nurse educator may report to:",o:["Only the CEO","Both a department manager and a project or service-line leader","No one","Only a peer"],a:1,w:"Matrix structures have dual reporting lines, mixing functional and project or service-line authority. They're flexible but can cause role confusion.",h:"Matrix = two bosses."},
{d:"HCD",q:"Systems theory views a nursing unit as having inputs, throughput, outputs and:",o:["Feedback","Profit","Hierarchy","Seniority"],a:0,w:"Systems theory sees organizations as open systems that take inputs (staff, supplies), transform them (care), produce outputs (outcomes), and adjust based on feedback.",h:"Input → throughput → output → feedback."},
{d:"HCD",q:"A nurse believes a physician's order is unsafe, and the physician won't change it. The nurse should:",o:["Carry out the order as written","Withhold it and use the chain of command","Change the order herself","Ask the patient to decide"],a:1,w:"Nurses have a duty to advocate for patient safety. Hold the unsafe order and escalate through the chain of command, documenting the actions taken.",h:"Unsafe order → escalate up the chain."},
{d:"HCD",q:"AIDET, a patient communication framework, stands for:",o:["Assess, Intervene, Document, Evaluate, Teach","Acknowledge, Introduce, Duration, Explanation, Thank you","Advocate, Inform, Discuss, Educate, Treat","Admit, Inspect, Discharge, Educate, Track"],a:1,w:"AIDET structures each patient interaction to reduce anxiety and improve the patient experience.",h:"Acknowledge, Introduce, Duration, Explanation, Thank you."},
{d:"HCD",q:"Which approach best reflects cultural humility?",o:["Memorizing traits of each cultural group","Asking patients about their own beliefs and preferences and reflecting on your own biases","Treating all patients exactly the same","Assigning patients to staff of the same culture"],a:1,w:"Cultural humility is lifelong self-reflection and learning from each patient, instead of relying on generalizations about groups.",h:"Ask, listen, check your own bias."},
{d:"HCD",q:"A patient with low health literacy is being discharged on a new medication. The best approach is:",o:["A detailed medical pamphlet","Plain language, a few key points, and teach-back","Telling the family only","Referring them to the drug company website"],a:1,w:"Health literacy best practices are plain language, focusing on 2–3 key messages, and confirming understanding with teach-back for every patient.",h:"Plain words, few points, teach-back."},
{d:"HCD",q:"A nurse calls the home health nurse and introduces her to the patient before discharge. This is called a:",o:["Warm handoff","Cold transfer","Referral form","Utilization review"],a:0,w:"A warm handoff happens in real time with the patient included, which builds trust and continuity across care transitions.",h:"Warm handoff = live introduction."}
];

const TOPICS={LS:"Leadership, power & delegation",MOT:"Motivation theories",CHG:"Change management",JC:"Just culture",CONF:"Conflict & team dynamics",DEV:"Staff development & retention",EMP:"Employment law & HR",PERF:"Performance management",QI:"QI tools & measures",SAFE:"Patient safety practices",COMM:"Communication & patient teaching",FIN:"Budgets & finance",STAFF:"Staffing math & productivity",PAY:"Reimbursement & payment models",LEG:"Legal & regulatory",ETH:"Ethics",EBP:"Evidence-based practice & research",MOD:"Care models & org structure",POP:"Transitions, population health & equity",OPS:"Operations, informatics & emergencies"};
const TAGS="JC CONF MOT DEV LS CHG DEV PERF LS LS MOD EMP CHG QI QI QI QI QI SAFE SAFE COMM QI SAFE PAY STAFF STAFF FIN FIN FIN PAY FIN FIN STAFF EBP EBP POP ETH LEG OPS POP OPS MOD MOD MOD EMP EMP EMP EMP EMP EMP CONF EMP LS LS MOT MOT MOT DEV DEV PERF PERF PERF DEV ETH DEV EMP DEV PERF EMP CONF CONF LS LS JC JC PERF PERF MOT QI QI QI QI QI QI SAFE SAFE SAFE SAFE SAFE COMM COMM COMM QI SAFE SAFE SAFE SAFE SAFE QI FIN FIN FIN STAFF STAFF FIN STAFF PAY PAY PAY FIN FIN FIN PAY FIN MOD MOD MOD MOD LEG LEG LEG LEG LEG LEG ETH ETH ETH ETH MOD EBP EBP CHG LEG OPS OPS POP PAY POP OPS OPS LEG LEG MOD MOD MOD ETH COMM POP COMM COMM".split(" ");
Q.forEach((q,i)=>{q.t=TAGS[i]||"MOD"});

const KEY="nebc-drill-v1";
let stats={}; // id -> {seen, right, lastWrong}
try{stats=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){stats={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(stats))}catch(e){}}

const stage=document.getElementById("stage");
let set=[],idx=0,score=0,label="";

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function renderBoard(){
  const b=document.getElementById("board");b.innerHTML="";
  for(const k in DOMAINS){
    const items=Q.map((q,i)=>({q,i})).filter(x=>x.q.d===k);
    let seen=0,right=0;
    items.forEach(x=>{const s=stats[x.i];if(s){seen+=s.seen;right+=s.right}});
    const pct=seen?Math.round(right/seen*100):null;
    const el=document.createElement("div");el.className="dom";
    el.innerHTML=`<span class="pill" style="color:${DOMAINS[k].color}">${k}</span>
      <span class="name">${DOMAINS[k].name}</span>
      <span class="stat">${pct===null?"—":pct+"%"} <small>${seen?right+" of "+seen+" right":items.length+" questions"}</small></span>
      <span class="bar"><i style="width:${pct||0}%;background:${DOMAINS[k].color}"></i></span>`;
    b.appendChild(el);
  }
  const missed=Q.filter((q,i)=>stats[i]&&stats[i].lastWrong).length;
  renderWeak();
  const mb=document.getElementById("m-miss");mb.textContent="Missed ones ("+missed+")";mb.disabled=!missed;
}

function seenCount(i){return stats[i]?stats[i].seen:0}
// Least-seen first, so every question comes up before any repeats
function start(list,name){set=shuffle(list).sort((a,b)=>seenCount(a)-seenCount(b)).slice(0,10);idx=0;score=0;label=name;show()}

function renderWeak(){
  const seen=Q.filter((q,i)=>seenCount(i)>0).length;
  document.getElementById("seen").textContent=seen+" of "+Q.length+" questions seen";
  const t={};
  Q.forEach((q,i)=>{const s=stats[i];if(!s)return;const o=t[q.t]||(t[q.t]={seen:0,right:0});o.seen+=s.seen;o.right+=s.right});
  const ranked=Object.keys(t).filter(k=>t[k].seen>=3).map(k=>({k,pct:Math.round(t[k].right/t[k].seen*100),n:t[k].seen})).sort((a,b)=>a.pct-b.pct||b.n-a.n);
  const box=document.getElementById("weak");
  const answered=Object.values(stats).reduce((n,s)=>n+s.seen,0);
  if(answered<20||!ranked.length){box.innerHTML=`<p class="wnote">Answer ${Math.max(20-answered,1)} more question${20-answered===1?"":"s"} and your three weakest topics will show here.</p>`;return}
  const weak=ranked.filter(r=>r.pct<85).slice(0,3);
  if(!weak.length){box.innerHTML=`<p class="wnote">Every topic you've practiced is at 85% or better. Keep going to cover the rest.</p>`;return}
  box.innerHTML=weak.map(r=>`<div class="wrow"><span class="tn">${TOPICS[r.k]}</span><span class="tp">${r.pct}%</span><button class="btn" data-topic="${r.k}">Drill</button></div>`).join("")+`<p class="wnote">Look these up in your study guide, then drill them here.</p>`;
  box.querySelectorAll("[data-topic]").forEach(b=>b.addEventListener("click",()=>{const k=b.dataset.topic;start(Q.map((q,i)=>i).filter(i=>Q[i].t===k),TOPICS[k]);document.getElementById("stage").scrollIntoView({behavior:"smooth",block:"start"})}));
}

function show(){
  if(idx>=set.length)return finish();
  const i=set[idx],q=Q[i],D=DOMAINS[q.d];
  const order=shuffle(q.o.map((t,k)=>k));
  stage.innerHTML=`<article class="card">
    <div class="qhead"><span class="pill" style="color:${D.color}">${D.name}</span><span class="count">${idx+1} of ${set.length} · ${label}</span></div>
    <p class="stem">${q.q}</p>
    <div class="opts">${order.map((k,n)=>`<button class="opt" id="opt-${n}" data-k="${k}"><b>${"ABCD"[n]}</b><span>${q.o[k]}</span></button>`).join("")}</div>
    <div id="after"></div></article>`;
  stage.querySelectorAll(".opt").forEach(btn=>btn.addEventListener("click",()=>answer(i,+btn.dataset.k)));
  stage.querySelector(".opt").focus({preventScroll:true});
}

function answer(i,k){
  const q=Q[i],ok=k===q.a;
  const s=stats[i]||{seen:0,right:0,lastWrong:false};
  s.seen++;if(ok){s.right++;score++}s.lastWrong=!ok;stats[i]=s;save();
  stage.querySelectorAll(".opt").forEach(b=>{b.disabled=true;const bk=+b.dataset.k;if(bk===q.a)b.classList.add("right");else if(bk===k)b.classList.add("wrong")});
  document.getElementById("after").innerHTML=`<div class="why"><strong style="color:${ok?"var(--good)":"var(--bad)"}">${ok?"Correct":"Not quite"}</strong>${q.w}<div class="hook">Memory hook: ${q.h}</div><div class="hook">Topic: ${TOPICS[q.t]}</div></div>
    <div class="row" style="margin-top:12px"><button class="btn primary" id="next">${idx+1<set.length?"Next question":"See results"}</button></div>`;
  const n=document.getElementById("next");n.addEventListener("click",()=>{idx++;show()});n.focus({preventScroll:true});
  renderBoard();
}

function finish(){
  const pct=Math.round(score/set.length*100);
  const msg=pct>=80?"Strong set. Try a weaker domain next.":pct>=65?"Close to passing range. Review the misses.":"Worth another pass. Hit Missed ones next.";
  stage.innerHTML=`<article class="card done"><span class="eyebrow">${label} complete</span><span class="big">${score}/${set.length}</span><p style="margin:0">${msg}</p>
    <div class="row" style="justify-content:center"><button class="btn primary" id="again">Another mixed set</button></div></article>`;
  document.getElementById("again").addEventListener("click",()=>start(Q.map((q,i)=>i),"Mixed"));
}

document.getElementById("m-mix").addEventListener("click",()=>start(Q.map((q,i)=>i),"Mixed"));
document.querySelectorAll("[data-dom]").forEach(b=>b.addEventListener("click",()=>{const d=b.dataset.dom;start(Q.map((q,i)=>i).filter(i=>Q[i].d===d),DOMAINS[d].name)}));
document.getElementById("m-miss").addEventListener("click",()=>start(Q.map((q,i)=>i).filter(i=>stats[i]&&stats[i].lastWrong),"Missed"));
document.getElementById("reset").addEventListener("click",()=>{document.getElementById("confirm").hidden=false});
document.getElementById("reset-yes").addEventListener("click",()=>{stats={};save();document.getElementById("confirm").hidden=true;renderBoard()});

renderBoard();
start(Q.map((q,i)=>i),"Mixed");
</script>
</body></html>
